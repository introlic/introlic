version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: introlic-db
    restart: always
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: ${DB_USER:-introlic}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-introlic_secret}
      POSTGRES_DB: ${DB_NAME:-introlic}
    volumes:
      - introlic-db-data:/var/lib/postgresql/data
    networks:
      - introlic-network

  redis:
    image: redis:7-alpine
    container_name: introlic-redis
    restart: always
    ports:
      - "6379:6379"
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - introlic-redis-data:/data
    networks:
      - introlic-network

volumes:
  introlic-db-data:
    name: introlic-db-data
  introlic-redis-data:
    name: introlic-redis-data

networks:
  introlic-network:
    name: introlic-network
